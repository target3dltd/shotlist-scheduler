<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c31"/><stop offset="1" stop-color="#151518"/>
    </linearGradient>
    <clipPath id="arm"><rect x="8" y="10" width="48" height="11" rx="2.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
